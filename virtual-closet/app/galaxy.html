<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>the archive — galaxy</title>
<style>
  /* The Analytics Wall / Second Brain, per the design tokens: topological map on
     near-black, Ink ground, thumbnail nodes, thin translucent-white edges,
     controls in uppercase mono. Amber = selected, Oxblood = orphan/redundancy.

     Nodes are NOT tinted by garment colour. 60% of this closet is near-black
     (median L* 16.2, 35 of 58 below L*25), so colour-as-identity would be
     invisible here AND the palette insight it buys is already delivered better
     by /insights. Identity comes from the thumbnail; each sits on a white plate
     so a black garment reads on a black field. */
  :root {
    --ink:#0E0E10; --charcoal:#1C1D20; --graphite:#3A3D42;
    --oxblood:#6F2B2B; --amber:#CC8A3A; --paper:#F5F3EF; --dim:#8b8d92;

  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--ink); color:var(--paper);
    font:13px/1.45 Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased;
    overflow:hidden; }
  .mono { font-family:'IBM Plex Mono','Spline Sans Mono',ui-monospace,Menlo,monospace;
    text-transform:uppercase; letter-spacing:.16em; font-size:10px; }

  header { position:fixed; top:0; left:0; right:0; z-index:20; padding:16px 22px;
    display:flex; align-items:baseline; gap:20px; flex-wrap:wrap;
    background:linear-gradient(180deg, rgba(14,14,16,.95), rgba(14,14,16,0)); }
  .wordmark { font-style:italic; font-size:17px; color:var(--paper);
    text-decoration:none; }
  .spacer { flex:1; }
  header .mono { color:var(--dim); }

  #stage { position:fixed; inset:0; }
  /* two stacked canvases: the field, then the glass layer that refracts it */
  #stage canvas { position:absolute; inset:0; display:block;
    width:100%; height:100%; cursor:grab;
    /* Without this the browser claims the gesture first: a one-finger drag
       scrolls the page and a pinch zooms the document, and the pointer handlers
       below never see either. The field IS the interaction surface, so it takes
       the whole gesture. */
    touch-action:none; }
  #glass { pointer-events:none; }
  canvas.grabbing { cursor:grabbing; }

  /* controls — instrumentation, per the tokens */
  #controls { position:fixed; left:22px; bottom:22px; z-index:20; display:flex;
    flex-direction:column; gap:12px; }
  .ctl { display:flex; align-items:center; gap:10px; color:var(--dim); }
  .ctl input[type=range] { width:120px; accent-color:var(--paper); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; max-width:340px; }
  .chip { border:1px solid var(--graphite); color:var(--dim); background:none;
    padding:5px 10px; cursor:pointer; font:inherit; }
  .chip.on { border-color:var(--paper); color:var(--paper); }
  /* time scrubber — instrumentation, same weight as the other controls. The
     readout is fixed-width so counting up does not shift the row; the note is a
     standing caveat, not a transient message, so it holds its line always. */
  #timectl input[type=range] { width:190px; }
  #timectl .treadout { color:var(--paper); white-space:nowrap;
    font-variant-numeric:tabular-nums; min-width:150px; }
  #timectl.scrubbing .treadout { text-shadow:0 0 9px rgba(245,243,239,.5); }
  .tnote { color:var(--graphite); letter-spacing:.12em; text-transform:none;
    white-space:nowrap; }
  #panel .orow.empty { color:var(--graphite); cursor:default; }
  #panel .orow.empty:hover { color:var(--graphite); text-shadow:none; }

  /* the glass panel — this is the one surface on the site with a dark field
     behind it, which is the whole reason glassmorphism was re-homed here */
  /* The glass itself is drawn on the canvas (drawReededGlass) so it can really
     refract the field behind it; this element only carries the content and lets
     that show through. */
  #detail { position:fixed; top:64px; right:22px; width:290px; z-index:25;
    background:rgba(14,14,16,.74); border:0; padding:16px; display:none; }
  #detail.open { display:block; }
  #detail .fig { height:150px; display:flex; align-items:center; justify-content:center;
    background:var(--paper); margin-bottom:12px; }
  #detail .fig img { max-height:92%; max-width:92%; object-fit:contain; }
  #detail h3 { margin:0 0 4px; font-size:14px; font-weight:normal; }
  #detail .meta { color:var(--dim); }
  #detail .stats { display:flex; gap:14px; margin:12px 0; }
  #detail .stats div span { display:block; color:var(--dim); }
  #detail .acts { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
  #detail .acts a { border:1px solid rgba(245,243,239,.3); color:var(--paper);
    text-decoration:none; padding:8px 10px; text-align:center; }
  #detail .acts a:hover { background:rgba(245,243,239,.12); }
  #detail .close { position:absolute; top:10px; right:12px; cursor:pointer;
    color:var(--dim); background:none; border:0; font:inherit; }

  /* plain panel beside the graph — the plan's own anti-pattern guard: the graph
     explores, the panel answers */
  /* sits ON the glass column, so it carries only a hairline and its ground —
     the refraction behind it is the surface. The ground was .34 while the glass
     was imaging empty ink; now that it gathers the field, streaks ran straight
     through the type, so it carries enough to read against and no more. */
  #panel { position:fixed; right:22px; bottom:22px; z-index:20; width:290px;
    border:1px solid rgba(245,243,239,.18); background:rgba(14,14,16,.74);
    padding:14px 16px; }
  #panel h4 { margin:0 0 10px; font-weight:normal; color:var(--dim); }
  #panel .orow { display:flex; justify-content:space-between; gap:10px;
    padding:4px 0; cursor:pointer; }
  /* Hover lights the row rather than recolouring it. Amber was wrong twice over:
     the tokens reserve it for the SELECTED state, and a second hue competes with
     oxblood, which already means something specific here. On a page whose whole
     language is emitted light, glow is the native signal. */
  #panel .orow:hover { color:var(--paper);
    text-shadow:0 0 9px rgba(245,243,239,.55), 0 0 20px rgba(245,243,239,.22); }
  #panel .orow span:last-child { color:var(--dim); }
  #legend { position:fixed; left:22px; top:64px; z-index:20; color:var(--dim);
    display:flex; flex-direction:column; gap:7px; }
  #legend div { display:flex; align-items:center; gap:8px; }
  #legend i { width:22px; height:0; border-top:1px solid; display:block; }
  #legend .thick { border-top-width:1px; }
  #hint { position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    color:var(--dim); z-index:20; }
  @media (max-width:860px) { #panel, #legend { display:none; } }
  /* PHONE. Written 07-28 after the first render at a REAL 390px viewport
     (scripts/cdp.py — Chrome clamps --window-size to 500, so every earlier
     "390px" check was a 500px check and none of this was visible).
     Three separate faults, all only reachable on a phone: */
  @media (max-width:640px) {
    /* 1. The reeded glass is switched off in glassRect() — see the note there
       for why CSS alone could not do it (two render paths, one of which paints
       onto the main field canvas). This only hides the now-empty layer. */
    #glass { display:none; }
    /* 2. #controls and #hint were both bottom:22px, so the sliders, the chips,
       the caveat and the hint printed on top of one another. Controls become a
       real bottom bar with a ground behind them; they must stay legible over
       whatever node happens to drift underneath. */
    #controls { left:0; right:0; bottom:0; padding:14px 14px
      calc(14px + env(safe-area-inset-bottom)); gap:10px;
      background:linear-gradient(to top, rgba(14,14,16,.97) 72%, rgba(14,14,16,0)); }
    .ctl { gap:8px; }
    .ctl input[type=range] { width:100%; flex:1; min-width:0; }
    .chips { max-width:none; }
    /* 3. "drag to pan · scroll to zoom" is mouse language on a touch device,
       and it was the third thing stacked at the bottom. The gestures work
       either way; the sentence does not. */
    #hint { display:none; }
    /* nowrap forced the caveat off the right edge at 390px */
    .tnote { white-space:normal; }
  }
  /* money lock — the figures are encrypted in the deployed payload */
  .moneylock { display: inline-flex; align-items: center; gap: 8px; margin-left: 14px; }
  .moneylock button { font-family: 'IBM Plex Mono','Spline Sans Mono',ui-monospace,Menlo,monospace;
    text-transform: uppercase; letter-spacing: .16em; font-size: 10px;
    background: none; border: 1px solid var(--graphite); color: var(--dim);
    padding: 5px 10px; cursor: pointer; }
  .moneylock button:hover { border-color: var(--paper); color: var(--paper); }
  .moneylock input { font: inherit; font-size: 11px; padding: 4px 7px; width: 100px;
    background: rgba(14,14,16,.8); border: 1px solid var(--graphite); color: var(--paper); }
  .moneylock .ml-msg { font-size: 10px; letter-spacing: .14em; color: var(--oxblood);
    text-transform: uppercase; }
</style></head>
<body>
<header>
  <a class="wordmark" href="/">the archive.</a>
  <span class="mono">Galaxy</span>
  <span class="spacer"></span>
  <span class="mono" id="stats"></span>
  <span id="lockhost"></span>
</header>

<div id="stage"><canvas id="c"></canvas><canvas id="glass"></canvas></div>

<div id="legend" class="mono">
  <div><i style="border-color:rgba(245,243,239,.55)"></i> worn together</div>
  <div><i style="border-color:rgba(245,243,239,.16);border-top-style:dashed"></i> could pair</div>
  <div><i style="border-color:var(--oxblood)"></i> never worn</div>
</div>

<div id="controls">
  <div class="ctl mono"><label for="spread">Spread</label>
    <input id="spread" type="range" min="60" max="300" value="165"></div>
  <div class="ctl mono"><label for="lines">Line weight</label>
    <input id="lines" type="range" min="0" max="100" value="60"></div>
  <div class="chips mono" id="chips"></div>
  <!-- TIME SCRUBBER (plan E.4). Runs on ACQUISITION, not wear — see the note in
       galaxy_data(). Defaults to the last month so the page opens exactly as it
       did before: the scrub is something you reach for, not a state you land in. -->
  <div class="ctl mono" id="timectl">
    <button class="chip" id="tplay" title="replay the closet accumulating">play</button>
    <input id="time" type="range" min="0" max="0" value="0">
    <span id="tread" class="treadout"></span>
  </div>
  <div class="mono tnote" id="tnote">rings mark never-worn today, not that month</div>
</div>

<div id="panel" class="mono">
  <h4>Never worn — click to locate</h4>
  <div id="orphans"></div>
</div>

<div id="detail">
  <button class="close mono" id="dclose">close</button>
  <div class="fig"><img id="dimg" alt=""></div>
  <h3 id="dname"></h3>
  <div class="meta mono" id="dmeta"></div>
  <div class="stats mono" id="dstats"></div>
  <div class="acts mono" id="dacts"></div>
</div>

<div id="hint" class="mono">drag to pan · scroll to zoom · click a garment</div>

<script src="/app/nav.js"></script>
<script src="/app/unlock.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let NODES = [], EDGES = [], IMG = {}, VIEW = {x:0, y:0, k:1};
let hover = null, selected = null, filter = null;
// 165 = 55% of the slider's scale. The settled cloud is a force balance
// (gravity 0.0016 in, repulsion spread^2/d^2 out), so extent is not linear in
// this: measured at 1440x900 it moves the cloud from 39.7% to 41.8% of the
// width and 67.1% to 70.5% of the height. Height runs ~1.6x the width figure
// because a roughly circular cloud sits in a 16:10 frame — which is why the
// useful ceiling is well under what the slider allows.
let spread = 165, lineAlpha = 0.6;

const OX = '#6F2B2B', AMBER = '#CC8A3A', PAPER = '#F5F3EF';

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

function buildOrphans() {
  const host = document.getElementById('orphans');
  host.innerHTML = '';
  // scoped to what is on screen: while scrubbed back, listing a garment she had
  // not bought yet would answer for a closet that did not exist
  const rows = NODES.filter(n => n.orphan && presentAt(n));
  if (!rows.length) {
    // a header with nothing under it reads as a failure to load rather than as
    // an empty set — say so, in the panel's own voice
    const e = document.createElement('div');
    e.className = 'orow empty';
    e.textContent = NODES.length ? 'none owned at this point' : '—';
    host.appendChild(e);
    return;
  }
  rows
    .sort((a, b) => (b.price || 0) - (a.price || 0)).slice(0, 8)
    .forEach(n => {
      const row = document.createElement('div'); row.className = 'orow';
      const a = document.createElement('span'); a.textContent = n.name;
      const b = document.createElement('span'); b.textContent = price(n.price);
      row.append(a, b);
      row.onclick = () => { select(n); centreOn(n); };
      host.appendChild(row);
    });
}

function radius(n) {
  // size encodes wear count (plan E.2); floor keeps a never-worn garment findable
  return 13 + Math.min(n.wears, 6) * 3.0;
}

// Prices are stripped from the deployed payload and sealed (see unlock.js), so
// a locked figure must read $XXX while a garment that simply has no price stays
// blank — `null` means different things in those two cases.
const price = p => (window.MoneyLock && MoneyLock.locked) ? '$XXX'
                 : (p ? '$' + Math.round(p) : '');

fetch('/api/galaxy').then(r => r.json()).then(d => {
  if (d.error) { document.getElementById('stats').textContent = d.error; return; }
  NODES = d.nodes.map((n, i) => {
    const a = (i / d.nodes.length) * Math.PI * 2;
    return Object.assign({}, n, {
      x: innerWidth/2 + Math.cos(a) * 220 + (Math.random()-.5)*40,
      y: innerHeight/2 + Math.sin(a) * 220 + (Math.random()-.5)*40,
      vx: 0, vy: 0,
      phase: (i * 2.399) % (Math.PI * 2),        // golden-angle: no two in step
      // noise-clustered reveal delay, the same shape nav.js uses for its glyphs
      revealAt: (0.5 + 0.5 * Math.sin(i * 0.9)) * 900 + Math.random() * 900
    });
  });
  const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
  EDGES = d.edges.map(e => ({...e, s: byId[e.a], t: byId[e.b]})).filter(e => e.s && e.t);

  document.getElementById('stats').textContent =
    `${d.stats.garments} garments · ${d.stats.worn_edges} worn links · `
    + `${d.stats.potential_edges} possible · ${d.stats.orphans} never worn`;

  // category filter chips
  const cats = [...new Set(NODES.map(n => n.category))].filter(Boolean).sort();
  const chips = document.getElementById('chips');
  cats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = c;
    b.onclick = () => { filter = (filter === c ? null : c);
      [...chips.children].forEach(x => x.classList.toggle('on', x.textContent === filter)); };
    chips.appendChild(b);
  });

  // Attach BEFORE the first paint: until it runs, MoneyLock.locked is false and
  // every sealed price would render blank instead of $XXX.
  // Prices live in the payload, but NODES are copies of those objects, so an
  // unlock has to be carried across before anything re-renders.
  MoneyLock.attach(d, () => {
    d.nodes.forEach((n, i) => { NODES[i].price = n.price; });
    buildOrphans();
    if (selected) select(selected);
  });
  MoneyLock.mount(document.getElementById('lockhost'));

  // time scrubber over acquisition months; opens at the last one, so the page
  // looks exactly as it did before the scrubber existed
  MONTHS = d.months || [];
  const slider = document.getElementById('time');
  if (MONTHS.length > 1) {
    slider.max = MONTHS.length - 1;
    slider.value = MONTHS.length - 1;
    slider.addEventListener('input', () => { setPlaying(false); setTime(+slider.value); });
    document.getElementById('tplay').onclick = () => {
      if (playing) { setPlaying(false); return; }
      if (atEnd()) setTime(0);        // replay from the beginning
      setPlaying(true);
    };
    setTime(MONTHS.length - 1);
  } else {
    document.getElementById('timectl').style.display = 'none';
    document.getElementById('tnote').style.display = 'none';
  }

  // plain panel: the orphans, listed — the graph explores, this answers
  buildOrphans();

  NODES.forEach(n => { if (n.img) { const im = new Image(); im.src = n.img; IMG[n.id] = im; } });
  revealT0 = performance.now();
  scrambleIn(document.getElementById('stats'));
  requestAnimationFrame(tick);
});

// ── force layout: 58 nodes, so plain O(n^2) is fine (plan E.3) ──────────────
// The field never comes to rest. After the initial settle each node keeps a slow
// wander on its own phase, so the constellation breathes the way a real one
// would. Hovering does not freeze it — it drops to a crawl, which reads as
// attention rather than as a paused animation.
let motion = 1, motionTarget = 1;

function drift() {
  const t = clock / 1000;
  for (let i = 0; i < NODES.length; i++) {
    const n = NODES[i];
    const a = t * 0.10 + n.phase;
    n.vx += Math.cos(a) * 0.075 * motion;
    n.vy += Math.sin(a * 0.83 + n.phase) * 0.075 * motion;
  }
}

function step() {
  const cx = innerWidth / 2, cy = innerHeight / 2;
  for (const n of NODES) { n.vx *= 0.86; n.vy *= 0.86; }
  for (let i = 0; i < NODES.length; i++) {
    const a = NODES[i];
    a.vx += (cx - a.x) * 0.0016; a.vy += (cy - a.y) * 0.0016;   // gravity
    for (let j = i + 1; j < NODES.length; j++) {
      const b = NODES[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx*dx + dy*dy || 1; const d = Math.sqrt(d2);
      const min = radius(a) + radius(b) + 26;   // plates must not touch
      const rep = (spread * spread) / d2;
      let f = rep * 0.9;
      if (d < min) f += (min - d) * 3.2;                        // hard separation
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.vx -= fx * 0.02; a.vy -= fy * 0.02;
      b.vx += fx * 0.02; b.vy += fy * 0.02;
    }
  }
  for (const e of EDGES) {
    const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
    const d = Math.hypot(dx, dy) || 1;
    const rest = e.kind === 'worn' ? 150 : 240;
    const k = e.kind === 'worn' ? 0.0075 : 0.0022;
    const f = (d - rest) * k;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    e.s.vx += fx; e.s.vy += fy; e.t.vx -= fx; e.t.vy -= fy;
  }
  for (const n of NODES) { n.x += n.vx * motion; n.y += n.vy * motion; }
}

function neighbours(n) {
  if (!n) return null;
  const s = new Set([n.id]);
  for (const e of EDGES) {
    if (e.a === n.id) s.add(e.b);
    if (e.b === n.id) s.add(e.a);
  }
  return s;
}

// The same idea as the menu's glyph resolve (nav.js): nothing arrives in order.
// Nodes surface on noise-clustered delays and their plate resolves from the Ink
// ground rather than fading from nothing, so the field assembles out of the dark
// instead of sliding in.
const REVEAL_MS = 620;
let revealT0 = null;

function revealOf(n, now) {
  if (revealT0 === null) return 0;
  const e = (now - revealT0) - n.revealAt;
  if (e <= 0) return 0;
  if (e >= REVEAL_MS) return 1;
  return e / REVEAL_MS;
}

// ── time scrubber: the closet accumulating (plan E.4) ───────────────────────
// Runs on ACQUISITION. The wear log holds 15 rows, one per day across a single
// fortnight — replaying that is a ticker. Purchase dates span 2018-10..2026-07
// and carry the shape worth watching: 27 garments over seven years, then 31 in
// 2026 alone. E.4's own promise, "a March purchase that never lit up", is a
// claim about acquisition.
//
// Presence COMPOSES with the load-in reveal instead of replacing it: everything
// downstream already multiplies by `rv`, so folding the gate into that one value
// gates nodes, edges, halos and plates at once. Edges need no special case —
// they take min() across both endpoints, and an edge cannot precede its garments.
//
// Positions are NOT recomputed while scrubbing. Absent nodes stay in the force
// sim, so garments arrive into the place they will finally occupy and the
// constellation fills in rather than reflowing under the cursor.
let MONTHS = [], timeIdx = 0, playing = false, playAcc = 0;
const ARRIVE_MS = 520, PLAY_MS_PER_MONTH = 230;

const cutoff = () => (MONTHS.length ? MONTHS[timeIdx] : null);
const atEnd = () => timeIdx >= MONTHS.length - 1;

function presentAt(n) {
  const c = cutoff();
  if (!c || !n.acquired) return true;   // no timeline, or an undated garment
  return n.acquired <= c;               // 'YYYY-MM' compares lexicographically
}

function timeGate(n, now) {
  if (!presentAt(n)) return 0;
  if (!n.arrivedT) return 1;
  const e = now - n.arrivedT;
  return e >= ARRIVE_MS ? 1 : e / ARRIVE_MS;
}

function setTime(i, now) {
  const before = new Set(NODES.filter(presentAt).map(n => n.id));
  timeIdx = Math.max(0, Math.min(MONTHS.length - 1, i));
  now = now || performance.now();
  // only newly-arrived garments ease in; the ones already there must not re-ignite
  for (const n of NODES) if (presentAt(n) && !before.has(n.id)) n.arrivedT = now;
  const slider = document.getElementById('time');
  if (slider && +slider.value !== timeIdx) slider.value = timeIdx;
  const owned = NODES.filter(presentAt).length;
  document.getElementById('tread').textContent =
    `${cutoff() || '—'} · ${owned} of ${NODES.length}`;
  document.getElementById('timectl')
    .classList.toggle('scrubbing', !atEnd());
  buildOrphans();     // the panel answers for the moment on screen
}

function setPlaying(on) {
  playing = on;
  playAcc = 0;
  document.getElementById('tplay').textContent = on ? 'pause' : 'play';
  document.getElementById('tplay').classList.toggle('on', on);
}

function draw(now) {
  now = now || performance.now();
  ctx.save();
  ctx.fillStyle = '#0E0E10';
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.translate(VIEW.x, VIEW.y); ctx.scale(VIEW.k, VIEW.k);

  const focus = neighbours(selected || hover);
  const dimmed = id => (focus && !focus.has(id)) || (filter && byCat(id) !== filter);

  // Edges, additive so crossings bloom rather than muddy (plan E.3). Each line
  // is drawn twice: a wide, almost-transparent halo, then the crisp core on top.
  // Under 'lighter' the halo is what reads as luminous — and because it is
  // additive, places where several connections converge glow brighter on their
  // own, which is the nebula behaviour rather than a uniform neon stroke.
  // Dimmed edges get no halo: light is the signal, so unfocused links must not
  // emit any.
  ctx.globalCompositeOperation = 'lighter';
  for (const e of EDGES) {
    const rv = Math.min(revealOf(e.s, now), revealOf(e.t, now),
                        timeGate(e.s, now), timeGate(e.t, now));
    if (rv <= 0) continue;                     // an edge cannot precede its nodes
    const off = dimmed(e.a) || dimmed(e.b);
    const worn = e.kind === 'worn';
    const core = worn ? Math.min(1 + e.weight * 0.5, 3) : 1;

    if (!off) {
      ctx.beginPath();
      ctx.setLineDash([]);                     // the halo never dashes — a dashed
                                               // glow reads as a dotted line, not light
      ctx.lineWidth = core + (worn ? 7 : 5);
      ctx.strokeStyle = `rgba(226,232,245,${(worn ? 0.055 : 0.022) * lineAlpha * rv})`;
      ctx.moveTo(e.s.x, e.s.y); ctx.lineTo(e.t.x, e.t.y);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.setLineDash(worn ? [] : [3, 5]);
    ctx.lineWidth = core;
    ctx.strokeStyle = worn
      ? `rgba(245,243,239,${(off ? 0.06 : 0.5) * lineAlpha * rv})`
      : `rgba(245,243,239,${(off ? 0.02 : 0.14) * lineAlpha * rv})`;
    ctx.moveTo(e.s.x, e.s.y); ctx.lineTo(e.t.x, e.t.y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.globalCompositeOperation = 'source-over';

  for (const n of NODES) {
    const rv = Math.min(revealOf(n, now), timeGate(n, now));
    if (rv <= 0) continue;
    const r = radius(n), off = dimmed(n.id);
    // ease the plate up out of the ground, not in from white
    const ease = rv < 1 ? rv * rv * (3 - 2 * rv) : 1;
    ctx.globalAlpha = (off ? 0.22 : 1) * ease;

    // the garment as a dot field — no plate, no photograph
    const dz = ditherOf(n, r * 2 * VIEW.k) ;
    if (dz) {
      ctx.imageSmoothingEnabled = false;          // keep the dots crisp
      ctx.drawImage(dz, n.x - r, n.y - r, r*2, r*2);
      ctx.imageSmoothingEnabled = true;
    }
    if (n.orphan) {                       // reserved alert token, never colour alone
      ctx.strokeStyle = OX; ctx.lineWidth = 1;
      ctx.strokeRect(n.x - r - 1, n.y - r - 1, r*2 + 2, r*2 + 2);
    }
    if (selected && selected.id === n.id) {
      ctx.strokeStyle = AMBER; ctx.lineWidth = 2;
      ctx.strokeRect(n.x - r - 4, n.y - r - 4, r*2 + 8, r*2 + 8);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // ── detection HUD ────────────────────────────────────────────────────────
  // Drawn in SCREEN space, after the world transform is restored, so brackets
  // and type keep their weight at any zoom — a HUD that scales with the scene
  // stops being an instrument and becomes scenery.
  // Their "909" placeholder becomes the real record: id, category, wear count.
  const target = hover || selected;
  if (target && revealOf(target, now) >= 1) drawHUD(target);

  if (!GLASS_GL) drawReededGlass();   // the WebGL layer draws over us instead
}

// ── reeded glass ───────────────────────────────────────────────────────────
// Real refraction, not a CSS approximation — possible only because the backdrop
// is a canvas we own. Each rib behaves as a cylindrical lens: we sample a WIDER
// slice of what is behind and squeeze it into the rib's width, which magnifies
// and displaces exactly the way fluted glass does. Then frosting (fine grain)
// and a specular rim so the panel reads as having thickness.
const RIBS = 21, MAGNIFY = 1.5, FROST = 0.055;
let glassBuf = null, grainTile = null;

function makeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), d = x.createImageData(64, 64);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 200 + Math.random() * 55;
    d.data[i] = d.data[i+1] = d.data[i+2] = v;
    d.data[i+3] = Math.random() * 255 * FROST;
  }
  x.putImageData(d, 0, 0);
  return c;
}

function glassRect() {
  // A standing column down the right edge rather than a panel that appears with
  // the detail view: the glass is a LAYER of the page, and the never-worn box
  // and detail card sit on top of it.
  //
  // PHONE: no glass at all. The column exists to sit UNDER #panel and #detail,
  // both of which are already hidden below 860px — so on a phone it was a band
  // of refracted light across a third of the field with nothing layered on it,
  // occluding the data it exists to frame. Observed at a real 390px viewport on
  // 07-28 (scripts/cdp.py; Chrome clamps --window-size to 500, so no earlier
  // "390px" check could see it).
  //
  // Disabled HERE rather than by hiding #glass in CSS, because there are TWO
  // render paths and that only stopped one: WebGL draws onto #glass, but when
  // WebGL is unavailable drawReededGlass() paints onto the MAIN field canvas,
  // which no rule on #glass can touch. Both paths already bail on a sub-4px
  // rect, so an empty rect turns off both from one place — and the shader stops
  // running rather than merely being invisible, which matters on a phone.
  if (innerWidth <= 640) {
    return { left: innerWidth, top: 0, width: 0, height: innerHeight };
  }
  const w = Math.min(334, innerWidth * 0.34);
  return { left: innerWidth - w, top: 0, width: w, height: innerHeight };
}

function drawReededGlass() {
  const b = glassRect();
  const w = Math.round(b.width), h = Math.round(b.height);
  if (w < 4 || h < 4) return;

  if (!glassBuf) glassBuf = document.createElement('canvas');
  if (glassBuf.width !== w || glassBuf.height !== h) { glassBuf.width = w; glassBuf.height = h; }
  const g = glassBuf.getContext('2d');

  // snapshot what is behind the panel before we overwrite it
  g.clearRect(0, 0, w, h);
  g.drawImage(cv, b.left * (cv.width / innerWidth), b.top * (cv.height / innerHeight),
              w * (cv.width / innerWidth), h * (cv.height / innerHeight), 0, 0, w, h);

  ctx.save();
  ctx.beginPath(); ctx.rect(b.left, b.top, w, h); ctx.clip();
  ctx.fillStyle = 'rgba(14,14,16,.55)';
  ctx.fillRect(b.left, b.top, w, h);

  const ribW = w / RIBS;
  for (let i = 0; i < RIBS; i++) {
    const sxc = (i + 0.5) * ribW;               // rib centre in source space
    const srcW = ribW * MAGNIFY;
    ctx.globalAlpha = 0.9;
    ctx.drawImage(glassBuf,
      Math.max(0, sxc - srcW / 2), 0, srcW, h,
      b.left + i * ribW, b.top, ribW + 0.5, h);
    // each rib carries a bright edge where the curvature turns
    ctx.globalAlpha = 1;
    const grad = ctx.createLinearGradient(b.left + i*ribW, 0, b.left + (i+1)*ribW, 0);
    grad.addColorStop(0, 'rgba(245,243,239,.055)');
    grad.addColorStop(0.5, 'rgba(245,243,239,0)');
    grad.addColorStop(1, 'rgba(10,10,12,.16)');
    ctx.fillStyle = grad;
    ctx.fillRect(b.left + i*ribW, b.top, ribW, h);
  }

  if (!grainTile) grainTile = makeGrain();       // frosting
  const pat = ctx.createPattern(grainTile, 'repeat');
  ctx.fillStyle = pat;
  ctx.fillRect(b.left, b.top, w, h);

  ctx.restore();

  // specular rim: light catches the top and left, shadow falls to the right
  ctx.save();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(245,243,239,.34)';
  ctx.beginPath();
  ctx.moveTo(b.left + .5, b.top + h); ctx.lineTo(b.left + .5, b.top + .5);
  ctx.lineTo(b.left + w, b.top + .5); ctx.stroke();
  ctx.strokeStyle = 'rgba(245,243,239,.10)';
  ctx.beginPath();
  ctx.moveTo(b.left + w - .5, b.top); ctx.lineTo(b.left + w - .5, b.top + h - .5);
  ctx.lineTo(b.left, b.top + h - .5); ctx.stroke();
  ctx.restore();
}

// ── reeded glass, WebGL ────────────────────────────────────────────────────
// A second stacked canvas running a real fragment shader over the field canvas
// as a texture. Structure ported from Brik's "Refractive Glass Studio" by
// Raquel Gómez Arango (source supplied 2026-07-26): the rib profile knob, the
// mouse-proximity falloff, the idle orbit and the frosting hash are all hers.
//
// Two deliberate departures from that reference:
//   1. No Three.js. This is one fullscreen quad and one shader; raw WebGL keeps
//      the page single-file and working offline, which a CDN import would not.
//   2. It displaces the sample sideways by sin(x). We MAGNIFY instead — each rib
//      samples a WIDER slice and squeezes it into the rib — which is what a
//      cylindrical lens actually does, and was already the 2D version's model.
//
// What the shader buys that Canvas 2D genuinely could not: per-channel sampling,
// so the ribs carry real chromatic aberration where their curvature turns.
// drawReededGlass() above stays as the fallback when WebGL is unavailable.
const GLASS_VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  // uv.y measured from the TOP, so it lines up with both the canvas texture
  // (uploaded unflipped) and the page's own screen coordinates
  vUv = vec2((aPos.x + 1.0) * 0.5, (1.0 - aPos.y) * 0.5);
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const GLASS_FS = `
precision highp float;
uniform sampler2D uTex;
uniform vec2  uRes;
uniform vec4  uRect;    // x0, y0, x1, y1 in 0..1, y from top
uniform vec2  uMouse;   // 0..1, y from top
uniform float uRibs, uSharp, uMagnify, uCA, uFrost, uTint, uHover, uTime, uGather;
varying vec2 vUv;

const vec3 INK   = vec3(0.055, 0.055, 0.063);
const vec3 PAPER = vec3(0.961, 0.953, 0.937);

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

void main() {
  vec2 uv = vUv;

  float mask = smoothstep(uRect.x, uRect.x + 0.0015, uv.x)
             * smoothstep(uRect.z, uRect.z - 0.0015, uv.x)
             * step(uRect.y, uv.y) * step(uv.y, uRect.w);
  if (mask <= 0.0) { gl_FragColor = vec4(0.0); return; }

  float gw = uRect.z - uRect.x;
  float gx = (uv.x - uRect.x) / gw;

  // position across one rib, -1 at its leading edge to +1 at its trailing edge
  float dn = fract(gx * uRibs) * 2.0 - 1.0;
  dn = sign(dn) * pow(abs(dn), 1.0 - uSharp);   // sine -> square, the reference's knob

  // refraction intensifies near the cursor (reference: hover_intensity)
  float aspect = uRes.x / uRes.y;
  float d = distance(uv * vec2(aspect, 1.0), uMouse * vec2(aspect, 1.0));
  float hoverK = smoothstep(0.42, 0.0, d) * (uHover - 1.0) + 1.0;

  // GATHER. Imaging only the strip directly behind the panel gives us nothing —
  // that strip is empty ground, and refracted black is black, which is why the
  // column read as plain stripes. Fluted glass with its subject at a distance
  // gathers a wide field instead, so the ribs image the FIELD (everything left
  // of the column) compressed across the panel. uGather 0 = literal backdrop.
  float scene = uRect.x;                          // the field ends where we begin
  float src = mix(uv.x, gx * scene, uGather);
  float srcRibW = mix(gw, scene, uGather) / uRibs;

  // cylindrical lens: each rib samples a wider slice and squeezes it
  float disp = srcRibW * dn * 0.5 * (uMagnify - 1.0) * hoverK;
  // fringing is strongest where the curvature turns, zero at the rib's centre
  float ca = uCA * dn * hoverK;

  vec3 col = vec3(
    texture2D(uTex, vec2(src + disp + ca, uv.y)).r,
    texture2D(uTex, vec2(src + disp,      uv.y)).g,
    texture2D(uTex, vec2(src + disp - ca, uv.y)).b
  );

  col = mix(col, INK, uTint);

  // The flutes CATCH the light. The reference drives only the refraction from
  // its moving point, which reads as light because its source is a photograph —
  // bending a bright image around is itself visible. Bending near-black ground
  // yields near-black, so here the light is added: the travelling highlight
  // drives the specular, each flute lighting along the edge where its curvature
  // turns, with a broad sheen behind it. PAPER only — no second hue.
  float lightK = smoothstep(0.55, 0.0, d);
  col += PAPER * max(0.0, -dn) * (0.075 + 0.40 * lightK);
  col += PAPER * lightK * 0.035;
  col = mix(col, INK, max(0.0, dn) * 0.20);      // shadow where it leaves
  col += (hash(uv * uRes + uTime) - 0.35) * uFrost;

  // specular rim: light catches the leading edge, shadow falls to the far one
  col = mix(col, PAPER, smoothstep(0.0018, 0.0, abs(uv.x - uRect.x)) * 0.34);
  col = mix(col, PAPER, smoothstep(0.0012, 0.0, abs(uv.x - uRect.z)) * 0.10);

  gl_FragColor = vec4(col, mask);
}`;

const GLASS_GL = (() => {
  const cg = document.getElementById('glass');
  let gl = null;
  try {
    gl = cg.getContext('webgl', { alpha: true, premultipliedAlpha: false, antialias: false })
      || cg.getContext('experimental-webgl', { alpha: true, premultipliedAlpha: false });
  } catch (e) { /* falls back to the 2D glass */ }
  if (!gl) return null;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.warn('glass shader:', gl.getShaderInfoLog(s)); return null;
    }
    return s;
  }
  const vs = compile(gl.VERTEX_SHADER, GLASS_VS), fs = compile(gl.FRAGMENT_SHADER, GLASS_FS);
  if (!vs || !fs) return null;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.warn('glass link:', gl.getProgramInfoLog(prog)); return null;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  // NPOT texture: clamp + linear, no mipmaps (WebGL1 requirement)
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

  const U = {};
  for (const n of ['uTex','uRes','uRect','uMouse','uRibs','uSharp','uMagnify',
                   'uCA','uFrost','uTint','uHover','uTime','uGather']) {
    U[n] = gl.getUniformLocation(prog, n);
  }

  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // the cursor drives the refraction; when it has been still a moment the glass
  // takes over and breathes on its own (reference: auto_hover), because on this
  // page nothing is allowed to rest
  // The light is NOT the cursor. An earlier pass let a pointermove hand the
  // highlight over to the mouse and only returned it after 1600ms of stillness,
  // which
  // meant the loop stopped the moment you touched the trackpad — the one thing
  // this page's language forbids. The reference's own preset ships auto_hover
  // true, ignoring the pointer for exactly this reason.
  // Aberration DEFAULTS OFF, and the reference's own saved preset had it at 0 too.
  // Measured here: it is the one thing Canvas 2D could not do, but the nodes are
  // Bayer-dithered dot fields — single-pixel high frequency — so separating the
  // channels does not fringe an edge, it decorrelates the dots into saturated
  // rainbow speckle. That puts colour into a page whose rule (decisions.md 07-26)
  // is that cybercore comes from processing artifacts and the palette stays Ink/
  // paper/oxblood/amber. The slider is there so the call is hers, not mine.
  // Tuned to the reference's own look rather than to the old 2D fallback:
  // it gathers strongly, magnifies hard (its flutes really smear), and frosts
  // much heavier than the 2D grain did. Aberration stays 0 — see decisions.md
  // 07-26: on dithered dot nodes it makes rainbow speckle, not edge fringing,
  // and colour is what this page's palette rule excludes.
  const GATHER = 0.88, MAGNIFY_GL = 3.4, ABERRATION = 0.0;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cg.width = Math.round(innerWidth * dpr);
    cg.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, cg.width, cg.height);
  }

  function render(now) {
    const b = glassRect();
    if (b.width < 4 || b.height < 4) { gl.clear(gl.COLOR_BUFFER_BIT); return; }

    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);

    const x0 = b.left / innerWidth, x1 = (b.left + b.width) / innerWidth;

    let mx, my;
    if (REDUCED) { mx = (x0 + x1) / 2; my = 0.5; }
    else {
      // The reference's own cadence: uTime += 0.01/frame x speed 2.5 = 1.5 rad/s,
      // a ~4.2s orbit. Faster than this page's ambient drift on purpose — the
      // glass is a surface catching light, not part of the field's motion.
      // Driven by the clock alone, so it never stops and never waits for input.
      const a = now / 1000 * 1.5;
      mx = (x0 + x1) / 2 + Math.cos(a) * (x1 - x0) * 0.5;
      my = 0.5 + Math.sin(a * 0.7) * 0.34;
    }

    gl.uniform1i(U.uTex, 0);
    gl.uniform2f(U.uRes, innerWidth, innerHeight);
    gl.uniform4f(U.uRect, x0, 0, x1, 1);
    gl.uniform2f(U.uMouse, mx, my);
    gl.uniform1f(U.uRibs, RIBS);
    gl.uniform1f(U.uSharp, 0.0);
    gl.uniform1f(U.uMagnify, MAGNIFY_GL);
    gl.uniform1f(U.uCA, ABERRATION);
    gl.uniform1f(U.uGather, GATHER);
    gl.uniform1f(U.uFrost, FROST * 2.6);
    gl.uniform1f(U.uTint, 0.10);
    gl.uniform1f(U.uHover, REDUCED ? 1.0 : 3.0);
    // quantised so the frosting reads as film grain rather than 60fps static
    gl.uniform1f(U.uTime, REDUCED ? 5 : Math.floor(now / 125));

    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  resize();
  addEventListener('resize', resize);   // its own listener: the page's resize()
  return { resize, render };            // runs before this IIFE has evaluated
})();

function drawHUD(n) {
  const r = radius(n) * VIEW.k + 7;
  const x = n.x * VIEW.k + VIEW.x, y = n.y * VIEW.k + VIEW.y;
  const t = 8;                                   // corner tick length
  ctx.save();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(245,243,239,.32)';
  ctx.strokeRect(x - r, y - r, r*2, r*2);

  ctx.strokeStyle = 'rgba(245,243,239,.9)';      // corners read as acquisition
  ctx.beginPath();
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx, sy]) => {
    ctx.moveTo(x + sx*r - sx*t, y + sy*r); ctx.lineTo(x + sx*r, y + sy*r);
    ctx.moveTo(x + sx*r, y + sy*r - sy*t); ctx.lineTo(x + sx*r, y + sy*r);
  });
  ctx.stroke();

  ctx.font = "9px 'IBM Plex Mono','Spline Sans Mono',ui-monospace,Menlo,monospace";
  ctx.textBaseline = 'alphabetic';
  const line1 = n.id.toUpperCase();
  const wear = n.wears === 0 ? 'NEVER WORN' : n.wears + (n.wears === 1 ? ' WEAR' : ' WEARS');
  const line2 = [(n.subcategory || n.category || '').toUpperCase(), wear,
                 price(n.price) || null].filter(Boolean).join('  ·  ');
  // the readout sits over a dot field, so it needs its own ground to stay legible
  const w = Math.max(ctx.measureText(line1).width, ctx.measureText(line2).width);
  ctx.fillStyle = 'rgba(14,14,16,.82)';
  ctx.fillRect(x - r - 3, y - r - 24, w + 8, 24);
  ctx.fillStyle = 'rgba(245,243,239,.92)';
  ctx.fillText(line1, x - r, y - r - 14);
  ctx.fillStyle = 'rgba(245,243,239,.55)';
  ctx.fillText(line2, x - r, y - r - 4);

  // links out, in the reference's dotted tracking style
  ctx.setLineDash([2, 4]);
  ctx.strokeStyle = 'rgba(245,243,239,.30)';
  for (const e of EDGES) {
    const o = e.a === n.id ? e.t : (e.b === n.id ? e.s : null);
    if (!o) continue;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(o.x * VIEW.k + VIEW.x, o.y * VIEW.k + VIEW.y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

const byCat = id => (NODES.find(n => n.id === id) || {}).category;

// ── 1-bit ordered dither ────────────────────────────────────────────────────
// Garments render as Bayer-dithered dot fields rather than photographs on white
// plates. Two reasons beyond the look: a dithered silhouette is quieter than a
// photo at 30px, and dot DENSITY carries luminance — so a near-black garment
// becomes a DENSE field of light instead of vanishing, which is what forced the
// white plates in the first place. The plates are gone.
const BAYER8 = [
  [ 0,32, 8,40, 2,34,10,42], [48,16,56,24,50,18,58,26],
  [12,44, 4,36,14,46, 6,38], [60,28,52,20,62,30,54,22],
  [ 3,35,11,43, 1,33, 9,41], [51,19,59,27,49,17,57,25],
  [15,47, 7,39,13,45, 5,37], [63,31,55,23,61,29,53,21]
].map(r => r.map(v => (v + 0.5) / 64));

const PIXEL = 2;                 // dot size, as in the reference
const ditherCache = {};

function ditherOf(node, px) {
  // bucket the size so a drifting node does not rebuild every frame
  const bucket = Math.max(24, Math.round(px / 8) * 8);
  const key = node.id + '@' + bucket;
  if (ditherCache[key]) return ditherCache[key];
  const im = IMG[node.id];
  if (!im || !im.complete || !im.naturalWidth) return null;

  const cells = Math.max(8, Math.round(bucket / PIXEL));
  const src = document.createElement('canvas');
  src.width = src.height = cells;
  const sx = src.getContext('2d', { willReadFrequently: true });
  const s2 = Math.min(cells / im.naturalWidth, cells / im.naturalHeight);
  const w = im.naturalWidth * s2, h = im.naturalHeight * s2;
  sx.drawImage(im, (cells - w) / 2, (cells - h) / 2, w, h);
  const data = sx.getImageData(0, 0, cells, cells).data;

  const out = document.createElement('canvas');
  out.width = out.height = cells * PIXEL;
  const ox = out.getContext('2d');
  ox.fillStyle = '#F5F3EF';
  for (let y = 0; y < cells; y++) {
    for (let x = 0; x < cells; x++) {
      const i = (y * cells + x) * 4;
      const a = data[i + 3] / 255;
      if (a < 0.45) continue;                       // outside the cutout
      const lum = (0.2126*data[i] + 0.7152*data[i+1] + 0.0722*data[i+2]) / 255;
      // floor of 0.30 so a white garment still reads; darker garments go denser
      const coverage = 0.30 + 0.70 * (1 - lum);
      if (coverage > BAYER8[y & 7][x & 7]) ox.fillRect(x*PIXEL, y*PIXEL, PIXEL, PIXEL);
    }
  }
  ditherCache[key] = out;
  return out;
}

// Lifted from nav.js so the two entrances read as one gesture: characters settle
// on clustered delays, and the true glyph becomes likelier as each one resolves.
function scrambleIn(el) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const POOL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ/·—+=<>[]{}|0123456789'.split('');
  const text = el.textContent, start = performance.now();
  const delays = text.split('').map((_, i) =>
    (0.5 + 0.5 * Math.sin(i * 0.9)) * 260 + Math.random() * 420);
  (function run(now) {
    const t = now - start; let done = true, out = '';
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === ' ') { out += ' '; continue; }
      const e = t - delays[i];
      if (e >= 520) { out += ch; continue; }
      done = false;
      out += e < 0 ? ' '
           : (Math.random() < e / 520 ? ch : POOL[(Math.random() * POOL.length) | 0]);
    }
    el.textContent = out;
    if (!done) requestAnimationFrame(run);
  })(performance.now());
}

let settle = 900;
// The browser already throttles rAF to a stop in a hidden tab, so no guard is
// needed for CPU — and an early `return` here would kill the loop permanently
// if the page ever loaded hidden. Instead the drift runs on its own clock with
// a clamped delta, so returning from a background tab resumes smoothly rather
// than snapping the field to a new phase.
let clock = 0, lastFrame = null;

function tick(now) {
  now = now || performance.now();
  const dt = lastFrame === null ? 16 : Math.min(now - lastFrame, 50);
  lastFrame = now; clock += dt;
  // hover/selection slows the field to a crawl; it never stops
  motionTarget = (hover || selected) ? 0.14 : 1;
  motion += (motionTarget - motion) * 0.06;
  if (settle > 0) { settle--; step(); }
  else { drift(); step(); }
  // playback advances on the clamped delta, not per frame, so the replay runs at
  // the same speed on a 120Hz screen as on a 60Hz one
  if (playing) {
    playAcc += dt;
    while (playAcc >= PLAY_MS_PER_MONTH) {
      playAcc -= PLAY_MS_PER_MONTH;
      if (atEnd()) { setPlaying(false); break; }
      setTime(timeIdx + 1, now);
    }
  }
  draw(now);
  if (GLASS_GL) GLASS_GL.render(now);   // strictly after the field is complete
  requestAnimationFrame(tick);
}

// ── interaction ────────────────────────────────────────────────────────────
function toWorld(px, py) {
  return { x: (px - VIEW.x) / VIEW.k, y: (py - VIEW.y) / VIEW.k };
}
function hit(px, py) {
  const p = toWorld(px, py);
  for (let i = NODES.length - 1; i >= 0; i--) {
    const n = NODES[i], r = radius(n);
    if (!presentAt(n)) continue;      // a garment she did not own yet is not there to click
    if (Math.abs(p.x - n.x) <= r && Math.abs(p.y - n.y) <= r) return n;
  }
  return null;
}
let dragging = false, last = null;
// Pinch (07-28). Zoom was wheel-only, so on a phone the field could be panned
// but never scaled — and at 390px the whole archive is a thumbnail. Tracked
// through the same pointer events as the pan, so there is one gesture model
// rather than a parallel touch path.
const pointers = new Map();
let pinchDist = 0;

function zoomAt(x, y, factor) {
  const p = toWorld(x, y);
  VIEW.k = Math.max(0.35, Math.min(3, VIEW.k * factor));
  VIEW.x = x - p.x * VIEW.k; VIEW.y = y - p.y * VIEW.k;
}

cv.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pointers.size === 2) {
    // A second finger turns a pan into a zoom. `dragging` is cleared so the
    // pointerup tap test below cannot fire select() when the pinch ends.
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    dragging = false;
    return;
  }
  dragging = true; last = {x: e.clientX, y: e.clientY}; cv.classList.add('grabbing');
});
addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  cv.classList.remove('grabbing');
  // Unchanged: a pointer that moved less than 4px is a tap, and a tap selects.
  // This is why tap-to-inspect already worked on touch — the HUD draws from
  // `hover || selected`, and a tap sets the second one.
  if (dragging && last && Math.hypot(e.clientX - last.x, e.clientY - last.y) < 4) {
    const n = hit(e.clientX, e.clientY);
    n ? select(n) : deselect();
  }
  dragging = false;
});
addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  dragging = false; cv.classList.remove('grabbing');
});
cv.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0 && d > 0) {
      // Zoom about the midpoint, so the field grows out of the gap between her
      // fingers rather than out of the corner.
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / pinchDist);
    }
    pinchDist = d;
    settle = Math.max(settle, 1);
    return;
  }

  if (dragging && last) {
    VIEW.x += e.clientX - last.x; VIEW.y += e.clientY - last.y;
    last = {x: e.clientX, y: e.clientY};
    settle = Math.max(settle, 1);
  } else {
    hover = hit(e.clientX, e.clientY);
    settle = Math.max(settle, 1);
  }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.08 : 1 / 1.08);
}, {passive:false});

function centreOn(n) {
  VIEW.k = 1.15;
  VIEW.x = innerWidth/2 - n.x * VIEW.k;
  VIEW.y = innerHeight/2 - n.y * VIEW.k;
}

function select(n) {
  selected = n;
  const d = document.getElementById('detail');
  document.getElementById('dimg').src = n.img || '';
  document.getElementById('dname').textContent = n.name;
  document.getElementById('dmeta').textContent =
    [n.subcategory || n.category, price(n.price) || null]
      .filter(Boolean).join(' · ');
  const st = document.getElementById('dstats'); st.innerHTML = '';
  [['worn', n.wears], ['links', n.worn_links],
   ['status', n.orphan ? 'never worn' : 'in rotation']].forEach(([k, v]) => {
    const el = document.createElement('div');
    const a = document.createElement('span'); a.textContent = k;
    const b = document.createTextNode(String(v));
    el.append(a, b); st.appendChild(el);
  });
  // E.5: every node click leads to an action
  const acts = document.getElementById('dacts'); acts.innerHTML = '';
  [['Style it in the fitting room', '/fitting-room'],
   ['Ask the stylist', '/stylist'],
   ['See it in insights', '/insights']].forEach(([label, href]) => {
    const a = document.createElement('a'); a.href = href; a.textContent = label;
    acts.appendChild(a);
  });
  d.classList.add('open');
  settle = Math.max(settle, 60);
}
function deselect() { selected = null; document.getElementById('detail').classList.remove('open'); }
document.getElementById('dclose').onclick = deselect;
addEventListener('keydown', e => { if (e.key === 'Escape') deselect(); });

document.getElementById('spread').addEventListener('input', e => {
  spread = +e.target.value; settle = Math.max(settle, 120);
});
document.getElementById('lines').addEventListener('input', e => {
  lineAlpha = +e.target.value / 60;
});
</script>
</body></html>
